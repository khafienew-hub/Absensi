<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Yayasan Yalal Wathon</title>
    
    <!-- PWA Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Yalal Wathon">
    <meta name="theme-color" content="#1a472a">

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- App Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a472a'/><text x='50%' y='55%' font-size='45' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>YW</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a472a'/><text x='50%' y='55%' font-size='45' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>YW</text></svg>">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0d2b17, #1a472a, #2e6b43);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        .logo-box {
            width: 90px;
            height: 90px;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 24px;
        }

        .loader-bar {
            width: 160px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .loader-progress {
            width: 100%;
            height: 100%;
            background-color: #68d391;
            position: absolute;
            left: -100%;
            animation: loading 1.2s infinite ease-in-out;
        }

        @keyframes loading {
            0% { left: -100%; }
            50% { left: 0%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <div class="logo-box">YW</div>
    <div class="title">Yayasan Yalal Wathon</div>
    <div class="subtitle">Membuka Aplikasi...</div>
    <div class="loader-bar">
        <div class="loader-progress"></div>
    </div>

    <script>
        const TARGET_URL = "https://yayasanyalalwathon.my.id";

        // Register Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        // Langsung redirect ke web utama tanpa iframe
        setTimeout(() => {
            window.location.replace(TARGET_URL);
        }, 600);
    </script>
</body>
</html>
