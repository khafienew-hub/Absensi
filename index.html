<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Memaksa resolusi viewport desktop lebar 1280px -->
    <meta name="viewport" content="width=1280, initial-scale=0.3, user-scalable=yes">
    <title>Yayasan Yalal Wathon - Desktop Mode</title>
    
    <!-- PWA Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a472a">

    <link rel="manifest" href="manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a472a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Container Desktop Memaksa Ukuran Lebar */
        #desktop-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0d2b17;
        }

        /* Frame dipatok minimum 1280px agar layout CSS responsive web tidak menciut ke mode HP */
        #main-frame {
            width: 100%;
            height: 100%;
            min-width: 1280px;
            border: none;
            background-color: #ffffff;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0d2b17, #1a472a, #2e6b43);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #ffffff;
            transition: opacity 0.5s ease;
        }

        .logo-box {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .loader-bar {
            width: 160px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-top: 15px;
        }

        .loader-progress {
            width: 100%;
            height: 100%;
            background-color: #68d391;
            position: absolute;
            left: -100%;
            animation: loading 1.2s infinite ease-in-out;
        }

        @keyframes loading {
            0% { left: -100%; }
            50% { left: 0%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="logo-box">YW</div>
        <div style="font-size: 20px; font-weight: 600;">Yayasan Yalal Wathon</div>
        <div style="font-size: 13px; opacity: 0.7; margin-top: 5px;">Memuat Mode Desktop...</div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <!-- Desktop Container -->
    <div id="desktop-wrapper">
        <iframe 
            id="main-frame" 
            src="https://yayasanyalalwathon.my.id">
        </iframe>
    </div>

    <script>
        const splash = document.getElementById('splash-screen');
        const iframe = document.getElementById('main-frame');

        function hideSplash() {
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
            }, 500);
        }

        iframe.onload = hideSplash;
        setTimeout(hideSplash, 3000);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
