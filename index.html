<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Yayasan Yalal Wathon</title>
    
    <!-- Pengaturan Mode Aplikasi / Layar Penuh -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a472a">

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a472a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Tampilan Layar Penuh */
        #app-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        /* Memuat Website Yayasan */
        #main-frame {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
        }

        /* Splash Screen Saat Awal Buka */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0d2b17, #1a472a, #2e6b43);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #ffffff;
            transition: opacity 0.5s ease;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .loader-bar {
            width: 150px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-top: 15px;
        }

        .loader-progress {
            width: 100%;
            height: 100%;
            background-color: #68d391;
            position: absolute;
            left: -100%;
            animation: loading 1.5s infinite ease-in-out;
        }

        @keyframes loading {
            0% { left: -100%; }
            50% { left: 0%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="logo-box">YW</div>
        <div style="font-size: 18px; font-weight: 600;">Yayasan Yalal Wathon</div>
        <div style="font-size: 12px; opacity: 0.7; margin-top: 4px;">Memuat Halaman...</div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <!-- Halaman Web Tertanam -->
    <div id="app-container">
        <iframe 
            id="main-frame" 
            src="https://yayasanyalalwatho.my.id" 
            allow="fullscreen; geolocation; camera; microphone">
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById('main-frame');
        const splash = document.getElementById('splash-screen');

        function closeSplash() {
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
            }, 500);
        }

        // Hilangkan splash saat web selesai dimuat
        iframe.onload = closeSplash;
        setTimeout(closeSplash, 3500); // Batas maksimal tunggu 3.5 detik

        // Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
